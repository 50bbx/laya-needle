<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>laya-needle settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>laya needle</h1>
      <p class="hint">
        Find by meaning, with the model on your own machine. Start the server
        first, in the repository folder.
      </p>
      <pre>python server.py</pre>
      <form id="settings">
        <label for="server">Laya server URL</label>
        <input id="server" type="url" required spellcheck="false" />
        <p class="hint">Default <code>http://127.0.0.1:8787</code></p>
        <div class="row">
          <button type="submit">Save connection</button>
          <button type="button" id="test" class="secondary">Test connection</button>
          <button type="button" id="reset" class="secondary">Reset</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="hint" style="margin-top:28px">
        Nothing leaves your computer. No API key, no account.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
